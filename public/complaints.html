<!-- public/complaints.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCMS - Complaints</title>
    <link rel="stylesheet" href="/css/common.css" />
    <!-- Keep the page hidden until the auth guard confirms a session, so an
         unauthenticated visitor never sees a flash of the page. -->
    <style>body.auth-pending { visibility: hidden; }</style>
</head>
<body class="auth-pending">
    <header class="site-header">
        <div class="brand">
            <div class="brand__text">
                <span class="brand__title">Hawker Centre Management System</span>
                <span class="brand__subtitle">Complaints</span>
            </div>
        </div>
        <div class="header-actions">
            <a class="session-btn" href="/customer-home.html">← Home</a>
            <button id="logout-btn" type="button" class="session-btn">
                <span class="session-btn__dot" aria-hidden="true"></span>
                <span id="session-email"></span>
                <span class="session-btn__label">· Log out</span>
            </button>
        </div>
    </header>

    <main class="layout layout--narrow">
        <section class="panel" aria-labelledby="submit-heading">
            <div class="panel__head">
                <h2 id="submit-heading" class="panel__title">File a Complaint</h2>
                <p class="panel__lead">Report poor hygiene or service so it can be escalated to the operator and NEA.</p>
            </div>

            <form id="submit-form" class="form-grid" novalidate>
                <div class="field field--full">
                    <label class="field__label" for="submit-stall">Stall</label>
                    <select id="submit-stall" class="input" required></select>
                </div>
                <div class="field">
                    <label class="field__label" for="submit-category">Category</label>
                    <select id="submit-category" class="input" required>
                        <option value="Hygiene">Hygiene</option>
                        <option value="Service">Service</option>
                        <option value="Food Quality">Food Quality</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="field field--full">
                    <label class="field__label" for="submit-description">Description</label>
                    <textarea id="submit-description" class="input" maxlength="2000" rows="4" required></textarea>
                </div>
                <div class="field field--full">
                    <button type="submit" class="btn btn--primary">Submit complaint</button>
                </div>
            </form>

            <div id="submit-message" class="message" role="status" aria-live="polite" hidden></div>
        </section>

        <section class="panel" aria-labelledby="list-heading">
            <div class="panel__head">
                <h2 id="list-heading" class="panel__title">My Complaints</h2>
                <p class="panel__lead">Track the status of complaints you've submitted.</p>
            </div>

            <div id="list-message" class="message" role="status" aria-live="polite" hidden></div>
            <div id="complaint-results" class="results"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Hawker Centre Management System · Complaints</p>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/complaints.js"></script>
</body>
</html>
