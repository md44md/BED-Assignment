<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Management — Hawker Centre System</title>
    <link rel="stylesheet" href="css/hygiene-grades.css" />
    <link rel="stylesheet" href="css/menu-items.css" />
</head>
<body>
    <!-- ============================================================
         Site header
         ============================================================ -->
    <header class="site-header">
        <div class="brand">
            <div class="brand__text">
                <span class="brand__title">Menu Management</span>
                <span class="brand__subtitle">Singapore Hawker Centre Management System</span>
            </div>
        </div>
        <!-- Stall owner session indicator — the whole thing is the log-out button -->
        <button id="logout-btn" type="button" class="session-btn" hidden>
            <span class="session-btn__dot" aria-hidden="true"></span>
            <span id="session-email"></span>
            <span class="session-btn__label">· Log out</span>
        </button>
    </header>

    <main class="layout">

        <!-- ============================================================
             MENU CONSOLE — shown once logged in.
             Backed by GET/POST /menuitems and PUT/DELETE /menuitems/:id.
             ============================================================ -->
        <section class="panel" id="menu-panel" aria-labelledby="menu-heading">
            <div class="panel__head">
                <h2 id="menu-heading" class="panel__title">Your menu items</h2>
                <p class="panel__lead">Add, edit, or remove the items on your stall's menu.</p>
            </div>

            <!-- Add item form -->
            <form id="add-form" class="form-grid" novalidate>
                <div class="field">
                    <label class="field__label" for="add-name">Item name</label>
                    <input id="add-name" class="input" type="text" maxlength="255" required />
                </div>
                <div class="field">
                    <label class="field__label" for="add-price">Price ($)</label>
                    <input id="add-price" class="input" type="number" min="0.01" step="0.01" required />
                </div>
                <div class="field">
                    <label class="field__label" for="add-category">Category</label>
                    <select id="add-category" class="input" required>
                        <option value="main">Main</option>
                        <option value="drink">Drink</option>
                        <option value="dessert">Dessert</option>
                        <option value="snack">Snack</option>
                        <option value="add-on">Add-on</option>
                    </select>
                </div>
                <div class="field field--full">
                    <label class="field__label" for="add-description">Description (optional)</label>
                    <input id="add-description" class="input" type="text" maxlength="1000" />
                </div>
                <button type="submit" class="btn btn--primary">Add item</button>
            </form>

            <div id="add-message" class="message" role="status" aria-live="polite" hidden></div>

            <div class="menu-toolbar">
                <button id="refresh-btn" type="button" class="btn btn--secondary btn--sm">Refresh list</button>
            </div>

            <div id="menu-message" class="message" role="status" aria-live="polite" hidden></div>
            <div id="menu-results" class="results"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Menu Management module · Individual feature · Hawker Centre Management System</p>
        <p class="site-footer__muted">Only the logged-in stall owner can view and manage their own menu items.</p>
    </footer>

    <script src="js/menu-items.js"></script>
</body>
</html>
