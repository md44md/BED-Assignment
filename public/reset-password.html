<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCMS - Reset Password</title>
    <link rel="stylesheet" href="/css/common.css" />
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <div class="brand__text">
                <span class="brand__title">Hawker Centre Management System</span>
                <span class="brand__subtitle">Reset Password</span>
            </div>
        </div>
        <a class="session-btn" href="/select-role.html">← Roles</a>
    </header>

    <main class="layout layout--narrow">
        <section class="panel" aria-labelledby="reset-heading">
            <div class="panel__head">
                <h2 id="reset-heading" class="panel__title">Choose a new password</h2>
                <p class="panel__lead">This link is single-use and expires 1 hour after it was sent.</p>
            </div>

            <form id="reset-form" class="form-grid" novalidate>
                <div class="field field--full">
                    <label class="field__label" for="reset-password">New password</label>
                    <input id="reset-password" class="input" type="password" autocomplete="new-password"
                           placeholder="••••••••" required />
                </div>
                <div class="field field--full">
                    <label class="field__label" for="reset-password-confirm">Confirm new password</label>
                    <input id="reset-password-confirm" class="input" type="password" autocomplete="new-password"
                           placeholder="••••••••" required />
                </div>
                <div class="field field--full">
                    <button type="submit" class="btn btn--primary">Reset password</button>
                </div>
            </form>

            <div id="reset-message" class="message" role="status" aria-live="polite" hidden></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Hawker Centre Management System</p>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/reset-password.js"></script>
</body>
</html>
