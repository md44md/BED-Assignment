<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCMS - Stall Menu</title>
    <link rel="stylesheet" href="/css/common.css" />
    <!-- Keep the page hidden until the auth guard confirms a session, so an
         unauthenticated visitor never sees a flash of the menu. -->
    <style>body.auth-pending { visibility: hidden; }</style>
</head>
<body class="auth-pending">
    <header class="site-header">
        <div class="brand">
            <div class="brand__text">
                <span class="brand__title">Hawker Centre Management System</span>
                <span class="brand__subtitle">Stall Menu</span>
            </div>
        </div>
        <div class="header-actions">
            <a class="session-btn" href="/customer-home.html">← Stalls</a>
            <a class="session-btn" href="/customer-cart.html">🛒 Cart</a>
            <a class="session-btn" href="/customer-orders.html">📋 My Orders</a>
            <button id="logout-btn" type="button" class="session-btn">
                <span class="session-btn__dot" aria-hidden="true"></span>
                <span id="session-email"></span>
                <span class="session-btn__label">· Log out</span>
            </button>
        </div>
    </header>

    <main class="layout">
        <section class="panel" aria-labelledby="stall-name">
            <div class="panel__head">
                <h2 id="stall-name" class="panel__title">Loading stall…</h2>
                <p id="stall-desc" class="panel__lead"></p>
            </div>

            <div id="menu-message" class="message" role="status" aria-live="polite" hidden></div>
            <div id="menu-results" class="results"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Hawker Centre Management System · Customer Role Access</p>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/customer-menu.js"></script>
</body>
</html>
