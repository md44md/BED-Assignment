<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCMS - Stall Owner Sign Up</title>
    <link rel="stylesheet" href="/css/common.css" />
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <div class="brand__text">
                <span class="brand__title">Hawker Centre Management System</span>
                <span class="brand__subtitle">Stall Owner Sign Up</span>
            </div>
        </div>
        <a class="session-btn" href="/select-role.html">← Roles</a>
    </header>

    <main class="layout layout--narrow">
        <section class="panel" aria-labelledby="signup-heading">
            <div class="panel__head">
                <h2 id="signup-heading" class="panel__title">Stall Owner - Sign Up</h2>
                <p class="panel__lead">
                    Create an account to manage your stall's menu, complaints and rental agreements.
                </p>
            </div>

            <form id="signup-form" class="form-grid" novalidate>
                <div class="field field--full">
                    <label class="field__label" for="signup-email">Stall Owner email</label>
                    <input id="signup-email" class="input" type="email" autocomplete="username"
                           placeholder="stallowner@email.com" required />
                </div>
                <div class="field">
                    <label class="field__label" for="signup-firstname">First name</label>
                    <input id="signup-firstname" class="input" type="text" autocomplete="given-name"
                           placeholder="Diana" required />
                </div>
                <div class="field">
                    <label class="field__label" for="signup-lastname">Last name</label>
                    <input id="signup-lastname" class="input" type="text" autocomplete="family-name"
                           placeholder="Koh" required />
                </div>
                <div class="field field--full">
                    <label class="field__label" for="signup-phone">Phone (optional)</label>
                    <input id="signup-phone" class="input" type="tel" autocomplete="tel"
                           placeholder="94567890" />
                </div>
                <div class="field field--full">
                    <label class="field__label" for="signup-password">Password</label>
                    <input id="signup-password" class="input" type="password" autocomplete="new-password"
                           placeholder="••••••••" required />
                    <p class="field__help">At least 8 characters.</p>
                </div>
                <div class="field field--full">
                    <label class="field__label" for="signup-confirm-password">Confirm password</label>
                    <input id="signup-confirm-password" class="input" type="password" autocomplete="new-password"
                           placeholder="••••••••" required />
                </div>
                <div class="field field--full">
                    <button type="submit" class="btn btn--primary">Sign up</button>
                </div>
            </form>

            <p class="hint">Already have an account? <a href="/stallowner-login.html">Log in here</a>.</p>
            <div id="signup-message" class="message" role="status" aria-live="polite" hidden></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Hawker Centre Management System · Stall Owner Role Access</p>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/stallowner-signup.js"></script>
</body>
</html>
