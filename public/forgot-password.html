<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCMS - Forgot Password</title>
    <link rel="stylesheet" href="/css/common.css" />
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <div class="brand__text">
                <span class="brand__title">Hawker Centre Management System</span>
                <span class="brand__subtitle">Forgot Password</span>
            </div>
        </div>
        <a class="session-btn" href="/select-role.html">← Roles</a>
    </header>

    <main class="layout layout--narrow">
        <section class="panel" aria-labelledby="forgot-heading">
            <div class="panel__head">
                <h2 id="forgot-heading" class="panel__title">Reset your password</h2>
                <p class="panel__lead">
                    Enter the email on your account and we'll send you a link to reset your password.
                </p>
            </div>

            <form id="forgot-form" class="form-grid" novalidate>
                <div class="field field--full">
                    <label class="field__label" for="forgot-email">Email</label>
                    <input id="forgot-email" class="input" type="email" autocomplete="username"
                           placeholder="you@email.com" required />
                </div>
                <div class="field field--full">
                    <button type="submit" class="btn btn--primary">Send reset link</button>
                </div>
            </form>

            <div id="forgot-message" class="message" role="status" aria-live="polite" hidden></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Hawker Centre Management System</p>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/forgot-password.js"></script>
</body>
</html>
