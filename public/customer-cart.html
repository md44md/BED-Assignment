<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCMS - My Cart</title>
    <link rel="stylesheet" href="/css/common.css" />
    <!-- Keep the page hidden until the auth guard confirms a session, so an
         unauthenticated visitor never sees a flash of the cart. -->
    <style>body.auth-pending { visibility: hidden; }</style>
</head>
<body class="auth-pending">
    <header class="site-header">
        <div class="brand">
            <div class="brand__text">
                <span class="brand__title">Hawker Centre Management System</span>
                <span class="brand__subtitle">My Cart</span>
            </div>
        </div>
        <div class="header-actions">
            <a class="session-btn" href="/customer-home.html">← Stalls</a>
            <button id="logout-btn" type="button" class="session-btn">
                <span class="session-btn__dot" aria-hidden="true"></span>
                <span id="session-email"></span>
                <span class="session-btn__label">· Log out</span>
            </button>
        </div>
    </header>

    <main class="layout">
        <section class="panel" aria-labelledby="cart-heading">
            <div class="panel__head">
                <h2 id="cart-heading" class="panel__title">My Cart</h2>
                <p class="panel__lead">Review your items before checking out. One order is placed per stall.</p>
            </div>

            <div id="cart-message" class="message" role="status" aria-live="polite" hidden></div>
            <div id="cart-results" class="results"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Hawker Centre Management System · Customer Role Access</p>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/customer-cart.js"></script>
</body>
</html>
