<!-- public/customer-nearby.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCMS - Nearby Hawker Centres</title>
    <link rel="stylesheet" href="/css/common.css" />
    <!-- Leaflet: interactive map library (loaded from CDN) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Keep the page hidden until the auth guard confirms a session, so an
         unauthenticated visitor never sees a flash of the page. -->
    <style>
        body.auth-pending { visibility: hidden; }
        #map { height: 420px; width: 100%; border-radius: 8px; margin-top: 1rem; }
    </style>
</head>
<body class="auth-pending">
    <header class="site-header">
        <div class="brand">
            <div class="brand__text">
                <span class="brand__title">Hawker Centre Management System</span>
                <span class="brand__subtitle">Nearby Hawker Centres</span>
            </div>
        </div>
        <div class="header-actions">
            <a class="session-btn" href="/customer-home.html">← Stalls</a>
            <button id="logout-btn" type="button" class="session-btn">
                <span class="session-btn__dot" aria-hidden="true"></span>
                <span id="session-email"></span>
                <span class="session-btn__label">· Log out</span>
            </button>
        </div>
    </header>

    <main class="layout layout--narrow">
        <section class="panel" aria-labelledby="nearby-heading">
            <div class="panel__head">
                <h2 id="nearby-heading" class="panel__title">Hawker Centres Near You</h2>
                <p class="panel__lead">Share your location to see hawker centres ranked by how close they are, plotted on the map.</p>

                <div class="form-row">
                    <button id="locate-btn" type="button" class="btn btn--primary btn--sm">📍 Find near me</button>
                    <label class="field__label" for="route-mode">Directions mode:</label>
                    <select id="route-mode" class="input">
                        <option value="walk">Walking</option>
                        <option value="drive">Driving</option>
                        <option value="cycle">Cycling</option>
                    </select>
                </div>
            </div>

            <div id="nearby-message" class="message" role="status" aria-live="polite" hidden></div>

            <div id="map"></div>

            <div id="centre-results" class="results"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Hawker Centre Management System · Locations powered by OneMap (SLA)</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/customer-nearby.js"></script>
</body>
</html>
