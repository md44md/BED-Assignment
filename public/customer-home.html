<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCMS - Customer Home</title>
    <link rel="stylesheet" href="/css/common.css" />
    <!-- Keep the page hidden until the auth guard confirms a session, so an
         unauthenticated visitor never sees a flash of the home page. -->
    <style>body.auth-pending { visibility: hidden; }</style>
</head>
<body class="auth-pending">
    <header class="site-header">
        <div class="brand">
            <div class="brand__text">
                <span class="brand__title">Hawker Centre Management System</span>
                <span class="brand__subtitle">Customer Home</span>
            </div>
        </div>
        <div class="header-actions">
            <a class="session-btn" href="/customer-cart.html">🛒 Cart</a>
            <a class="session-btn" href="/customer-orders.html">📋 My Orders</a>
            <a class="session-btn" href="/feedback.html">⭐ Feedback</a>
            <a class="session-btn" href="/complaints.html">📢 Complaints</a>
            <!-- The whole pill is the log-out button -->
            <button id="logout-btn" type="button" class="session-btn">
                <span class="session-btn__dot" aria-hidden="true"></span>
                <span id="session-email"></span>
                <span class="session-btn__label">· Log out</span>
            </button>
        </div>
    </header>

    <main class="layout">
        <section class="panel" aria-labelledby="home-heading">
            <div class="panel__head">
                <h2 id="home-heading" class="panel__title">Welcome back!</h2>
                <p class="panel__lead">
                    Pick a stall to browse its menu and add items to your cart.
                </p>
            </div>

            <div id="home-message" class="message" role="status" aria-live="polite" hidden></div>
            <div id="stall-grid" class="home-grid"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Hawker Centre Management System · Customer Role Access</p>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/customer-home.js"></script>
</body>
</html>
